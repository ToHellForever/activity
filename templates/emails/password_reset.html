<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Восстановление пароля</title>
</head>
<style>
body {
    margin: 0;
    padding: 0;
    background-color: #f4f4f4;
    font-family: 'Montserrat', sans-serif;
}

.email-wrapper {
    width: 100%;
    padding: 40px 0;
}

.email-container {
    background-color: #ffffff;
    border-radius: 12px;
    padding: 40px;
    max-width: 600px;
    margin: 0 auto;
}

.title {
    margin: 0 0 20px 0;
    font-size: 15px;
    color: #333333;
    font-weight: bold;
}

.greeting {
    font-size: 15px;
    color: #333333;
    line-height: 1.6;
    padding-bottom: 10px;
}

.message-text {
    font-size: 15px;
    color: #333333;
    line-height: 1.6;
    padding-bottom: 30px;
}

.password-card {
    background-color: #f9f9f9;
    border-radius: 20px;
    padding: 20px;
    padding-left: 15px;
    box-shadow: 1.93px 1.93px 9.64px 0px rgba(0, 0, 0, 0.5);
    margin-bottom: 20px;
}

.password-text {
    font-size: 15px;
    color: #333333;
    line-height: 1.8;
}

.password-label {
    color: rgba(119, 122, 141, 1);
    width: 130px;
    vertical-align: top;
    font-size: 15px;
}

.password-value {
    font-size: 15px;
    font-weight: bold;
}

.cta-button {
    display: inline-block;
    padding: 10px 30px;
    font-size: 15px;
    color: #ffffff;
    text-decoration: none;
    border-radius: 50px;
    letter-spacing: 1px;
    background-color: #ff8c42;
}

.warning-text {
    font-size: 15px;
    color: #333333;
    line-height: 1.6;
    padding-top: 20px;
    padding-bottom: 20px;
}

.footer-text {
    margin: 0;
    font-size: 15px;
    color: #888888;
}

.footer-spacer {
    padding-top: 30px;
    padding-bottom: 10px;
}
</style>
<body>
    <table role="presentation" class="email-wrapper" width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td align="center">
                <table role="presentation" class="email-container">

                    <!-- Заголовок -->
                    <tr>
                        <td class="title">
                            Восстановление пароля
                        </td>
                    </tr>

                    <!-- Приветствие -->
                    <tr>
                        <td class="greeting">
                            Здравствуйте!
                        </td>
                    </tr>

                    <!-- Сообщение -->
                    <tr>
                        <td class="message-text">
                            Вы запросили восстановление пароля на нашей платформе.
                            Используйте следующий временный пароль для входа:
                        </td>
                    </tr>

                    <!-- Карточка с паролем -->
                    <tr>
                        <td>
                            <table role="presentation" class="password-card" width="100%" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td class="password-text">
                                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                                            <tr>
                                                <td class="password-label">Ваш пароль:</td>
                                                <td class="password-value">{{ temp_password }}</td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Кнопка входа -->
                    <tr>
                        <td align="center" style="padding-top: 30px; padding-bottom: 24px;">
                            <table role="presentation" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td align="center" style="border-radius: 50px; background-color: #ff8c42;">
                                        <a href="{{ login_url }}" target="_blank" class="cta-button">
                                            ВОЙТИ В СИСТЕМУ
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Предупреждение -->
                    <tr>
                        <td class="warning-text">
                            Пожалуйста, измените пароль после входа в систему.
                        </td>
                    </tr>

                    <!-- Подвал -->
                    <tr>
                        <td>
                            <div class="footer-spacer"></div>
                            <p class="footer-text">
                                С уважением,<br>
                                Команда платформы
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
