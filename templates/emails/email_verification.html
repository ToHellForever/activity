<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Подтверждение почты</title>
</head>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        font-family: 'Verdana', sans-serif;
    }

    .email-wrapper {
        width: 100%;
        padding: 40px 0;
    }

    .email-container {
        background-color: #ffffff;
        padding: 40px;
    }

    .banner {
        background-color: #000066;
        border-radius: 16px;
        text-align: center;
        padding: 20px;
        margin-bottom: 30px;
    }

    .banner-text {
        margin: 0;
        font-size: 15px;
        font-weight: bold;
        color: #ffffff;
        letter-spacing: 1px;
    }

    .greeting {
        font-size: 15px;
        color: #333333;
        line-height: 1.3;
        padding-bottom: 16px;
    }

    .message-text {
        font-size: 15px;
        color: #333333;
        line-height: 1.3;
        padding-bottom: 24px;
    }

    .code-box {
        background-color: #f5f5f5;
        border-radius: 8px;
        text-align: center;
        padding: 20px;
        margin-bottom: 24px;
    }

    .code-value {
        margin: 0;
        font-size: 15px;
        font-weight: bold;
        color: rgba(38, 37, 37, 1);
        letter-spacing: 2px;
    }

    .ignore-text {
        font-size: 15px;
        color: #333333;
        line-height: 1.3;
        padding-bottom: 30px;
    }

    .footer-text {
        font-size: 15px;
        color: #333333;
        line-height: 1.3;
    }
</style>
<body>
    <table role="presentation" class="email-wrapper" width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td align="center">
                <table role="presentation" class="email-container">

                    <!-- Баннер -->
                    <tr>
                        <td>
                            <div class="banner">
                                <p class="banner-text">ПОДТВЕРЖДЕНИЕ ПОЧТЫ</p>
                            </div>
                        </td>
                    </tr>

                    <!-- Приветствие -->
                    <tr>
                        <td class="greeting">
                            Здравствуйте!
                        </td>
                    </tr>

                    <!-- Текст сообщения -->
                    <tr>
                        <td class="message-text">
                            Вы зарегистрировались на нашей платформе. Для завершения регистрации введите следующий код подтверждения.
                        </td>
                    </tr>

                    <!-- Код подтверждения -->
                    <tr>
                        <td>
                            <div class="code-box">
                                <p class="code-value">{{ code }}</p>
                            </div>
                        </td>
                    </tr>

                    <!-- Игнорировать -->
                    <tr>
                        <td class="ignore-text">
                            Если вы не регистрировались на нашей платформе, пожалуйста, проигнорируйте это письмо.
                        </td>
                    </tr>

                    <!-- Подвал -->
                    <tr>
                        <td class="footer-text">
                            С уважением,<br>
                            Команда платформы
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
