{% extends 'base.html' %}
{% load static %}
{% block title %}Контакты{% endblock %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/pages/contacts.css' %}">
<div class="contacts-page">
    <div class="contacts-container">
        <h1 class="contacts-title">Контакты</h1>

        <div class="contacts-hero">
            <div class="contacts-hero-title">СВЯЖИТЕСЬ С НАМИ ЛЮБЫМ УДОБНЫМ СПОСОБОМ</div>
            <div class="contacts-grid">
                <!-- Телефон -->
                <div class="contact-item">
                    <div class="contact-item-icon">
                        <svg viewBox="0 0 24 24" fill="white" width="28" height="28"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                    </div>
                    <div class="contact-item-label">Телефон</div>
                    <a href="tel:+70001234567" class="contact-item-link">+7 (000) 123-45-67</a>
                </div>

                <!-- Email -->
                <div class="contact-item">
                    <div class="contact-item-icon">
                        <svg viewBox="0 0 24 24" fill="white" width="28" height="28"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                    </div>
                    <div class="contact-item-label">Электронная почта</div>
                    <a href="mailto:support@business-africa.ru" class="contact-item-link">support@business-africa.ru</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
