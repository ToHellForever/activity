{% extends 'base.html' %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/pages/partner/scanner_not_found.css' %}">
{% endblock %}
{% block content %}
<div class="scanner-error-body">
    <div class="scanner-error-card">
        <div class="scanner-error-icon"><i class="bi bi-exclamation-triangle-fill"></i></div>
        <div class="scanner-error-title">Код доступа не найден</div>
        <div class="scanner-error-text">
            Ссылка для контроля входа недействительна или была удалена.<br>
            Обратитесь к организатору мероприятия.
        </div>
        <a href="/" class="scanner-error-btn">
            <i class="bi bi-house"></i> На главную
        </a>
    </div>
</div>
{% endblock %}
