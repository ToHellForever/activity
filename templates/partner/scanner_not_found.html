<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер — Код не найден</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .error-card {
            background: #fff;
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .error-icon { font-size: 64px; color: #dc3545; margin-bottom: 16px; }
        .error-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
        .error-text { color: #666; font-size: 14px; margin-bottom: 24px; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon"><i class="bi bi-exclamation-triangle-fill"></i></div>
        <div class="error-title">Код доступа не найден</div>
        <div class="error-text">
            Ссылка для контроля входа недействительна или была удалена.<br>
            Обратитесь к организатору мероприятия.
        </div>
        <a href="/" class="btn btn-outline-secondary">
            <i class="bi bi-house"></i> На главную
        </a>
    </div>
</body>
</html>
