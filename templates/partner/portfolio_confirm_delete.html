{% extends 'base.html' %}
{% load static %}

{% block content %}
<h1>Удаление кейса</h1>
<div class="row partner-layout" style="display:flex; gap:14px;">
    {% include 'includes/sidebar.html' with partner_profile=partner_profile %}
    <div class="partner-main">
        <div class="delete-confirm-box">
            <p>Вы уверены, что хотите удалить кейс "<strong>{{ portfolio_item.title }}</strong>"?</p>
            <p class="text-muted">Это действие нельзя будет отменить.</p>
            <form method="post" class="delete-form">
                {% csrf_token %}
                <div class="delete-form-actions">
                    <a href="{% url 'partner:portfolio_list' %}" class="btn btn-secondary">Отмена</a>
                    <button type="submit" class="btn btn-danger">Удалить</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
