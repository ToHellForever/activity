{% load static %}
<link rel="stylesheet" href="{% static 'css/modal_event_booking.css' %}">
<!-- Модальное окно заявки на участие в мероприятии -->
<div class="modal fade event-booking-modal" id="eventBookingModal" tabindex="-1" aria-labelledby="eventBookingModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="width: 100% !important;">
            <div class="modal-header">
                <h5 class="modal-title" id="eventBookingModalLabel">Заявка на участие</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>
            <div class="modal-body">
                <form id="event-booking-form" method="post" action="{% url 'send_event_booking_request' event.id %}">
                    {% csrf_token %}
                    <div class="mb-2">
                        <label for="event-booking-name" class="form-label">Имя</label>
                        <input type="text" name="name" id="event-booking-name" class="form-control"
                               maxlength="50" required
                               value="{% if user.is_authenticated %}{{ user.get_full_name }}{% endif %}">
                    </div>
                    <div class="mb-2">
                        <label for="event-booking-phone" class="form-label">Телефон</label>
                        <input type="tel" name="phone" id="event-booking-phone" class="form-control"
                               placeholder="8ХХХХХХХХХ или +7ХХХХХХХХХ" required>
                    </div>
                    <div class="mb-2">
                        <label for="event-booking-email" class="form-label">E-mail</label>
                        <input type="email" name="email" id="event-booking-email" class="form-control"
                               required value="{% if user.is_authenticated %}{{ user.email }}{% endif %}">
                    </div>
                    <div class="mb-2">
                        <label for="event-booking-participants" class="form-label">Количество участников</label>
                        <input type="number" name="participants_count" id="event-booking-participants"
                               class="form-control no-spinners" min="1" value="1" required>
                    </div>
                    <div class="mb-2">
                        <label for="event-booking-comment" class="form-label">Комментарий</label>
                        <textarea name="comment" id="event-booking-comment" class="form-control"
                                  rows="3" maxlength="300"></textarea>
                    </div>
                    <div id="event-booking-errors" class="alert alert-danger d-none"></div>
                    {% if not user.is_authenticated %}
                    <div class="event-booking-consent mb-2">
                        <label class="consent-label">
                            <input type="checkbox" name="personal_data_consent" id="event-booking-consent" required>
                            <span>Я даю согласие на обработку <a href="{% url 'privacy_policy' %}" target="_blank" rel="noopener">персональных данных</a></span>
                        </label>
                    </div>
                    {% endif %}
                    <button type="submit" class="btn-question w-100 mt-2" id="event-booking-submit">ОТПРАВИТЬ ЗАЯВКУ</button>
                </form>
                <div id="event-booking-success" class="d-none text-center">
                    <h5>Заявка отправлена!</h5>
                    <p>Организатор свяжется с вами по указанным контактам.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{% static 'js/pages/events/event_booking.js' %}"></script>
