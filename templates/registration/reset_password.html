{% extends 'base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/pages/registration/forgot_password.css' %}">
<div class="login-box">
    <h2 class="login-box-title">Новый пароль</h2>
    {% if error %}
        <p class="login-box-text">{{ error }}</p>
    {% else %}
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="password1" class="form-label">Новый пароль</label>
                <input type="password" id="password1" name="password1" minlength="8" required>
            </div>
            <div class="form-group">
                <label for="password2" class="form-label">Повторите пароль</label>
                <input type="password" id="password2" name="password2" minlength="8" required>
            </div>
            <button type="submit" class="submit-btn">Сменить пароль</button>
        </form>
    {% endif %}
    <div class="back-link">
        <a href="{% url 'login' %}" class="back-link">Вернуться к авторизации</a>
    </div>
</div>
{% endblock %}
