{% load static %}
<link rel="stylesheet" href="{% static 'css/sidebar.css' %}">

<!-- ===== Mobile top nav ===== -->
<div class="mobile-nav">
    <a href="{% url 'visitor:dashboard' %}"
       class="mobile-nav-item {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
        Мои билеты
    </a>
    <a href="{% url 'visitor:order_history' %}"
       class="mobile-nav-item {% if request.resolver_match.url_name == 'order_history' %}active{% endif %}">
        История заказов
    </a>
    <a href="{% url 'visitor:chats_list' %}"
       class="mobile-nav-item {% if request.resolver_match.url_name == 'chats_list' %}active{% endif %}">
        Чаты
    </a>
    <a href="{% url 'support_dashboard' %}"
       class="mobile-nav-item {% if request.resolver_match.url_name == 'support_dashboard' %}active{% endif %}">
        Поддержка
    </a>
    <a href="{% url 'visitor:settings' %}"
       class="mobile-nav-item {% if request.resolver_match.url_name == 'settings' %}active{% endif %}">
        Настройки
    </a>
</div>

<aside class="visitor-sidebar">
    <p class='sidebar-p'>Личный кабинет</p>
    <div class="sidebar-profile">
        <div class="sidebar-profile-row">
            <div class="sidebar-avatar">
                <img src="/media/icon/camera.svg" alt="">
            </div>
            <div class="sidebar-profile-info">
                <div class="sidebar-name">{{ user.get_full_name|default:user.username }}</div>
                <div class="sidebar-email">{{ user.email }}</div>
            </div>
        </div>
    </div>
    <nav class="sidebar-nav">
        <a href="{% url 'visitor:dashboard' %}"
           class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
            <img src="/media/icon/solar_ticket-bold.svg" alt="" class="sidebar-icon"> Мои билеты
        </a>
        <a href="{% url 'visitor:order_history' %}"
           class="{% if request.resolver_match.url_name == 'order_history' %}active{% endif %}">
            <img src="/media/icon/material-symbols_history-rounded.svg" alt="" class="sidebar-icon"> История заказов
        </a>
        <a href="{% url 'visitor:chats_list' %}"
           class="{% if request.resolver_match.url_name == 'chats_list' %}active{% endif %}">
            <img src="/media/icon/chats.svg" alt="" class="sidebar-icon"> Чаты с организаторами
        </a>
        <a href="{% url 'support_dashboard' %}"
           class="{% if request.resolver_match.url_name == 'support_dashboard' %}active{% endif %}">
            <img src="/media/icon/support.svg" alt="" class="sidebar-icon"> Служба поддержки
        </a>
        <a href="{% url 'visitor:settings' %}">
            <img src="/media/icon/material-symbols-light_settings-rounded.svg" alt="" class="sidebar-icon"> Настройки профиля
        </a>
        <a href="{% url 'logout' %}">
            <img src="/media/icon/logout.svg" alt="" class="sidebar-icon"> Выйти из аккаунта
        </a>
        
    </nav>
</aside>
