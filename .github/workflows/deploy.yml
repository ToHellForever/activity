# Название нашего workflow для отображения в интерфейсе GitHub
name: Deploy to VPS

# Указываем когда запускать - при push в main ветку
on:
  push:
    branches: [main, my-changes, watermark_on_video]

# Определяем задачи для выполнения
jobs:
  deploy:
    # Указываем на какой ОС запускать
    runs-on: ubuntu-latest

    steps:
      # Получаем код из репозитория
      - uses: actions/checkout@v3

      # Деплоим на сервер через SSH
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          # Используем секреты из GitHub для подключения
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

          # Команды выполняемые на сервере
          script: |
            set -e
            # Переходим в директорию проекта
            cd /home/v/activity

            # Деплоим именно ветку, которая запустила workflow
            git fetch origin "${{ github.ref_name }}"
            git checkout "${{ github.ref_name }}"
            # Отбрасываем любые локальные изменения в отслеживаемых файлах
            # (например, celerybeat-schedule перезаписывается демоном на сервере).
            # Production-код не должен иметь локальных правок на сервере.
            git checkout -- .
            git pull --ff-only origin "${{ github.ref_name }}"

            # Конфигурация (.env) хранится только на сервере и НЕ перезаписывается
            # деплоем. Если файла нет — падаем сразу с понятной ошибкой,
            # чтобы не положить gunicorn рестартом ниже.
            if [ ! -s .env ]; then
              echo "ERROR: /home/v/activity/.env отсутствует или пуст. Деплой прерван."
              exit 1
            fi

            # Если у вас PIP
            # Активируем виртуальное окружение
            # source venv/bin/activate

            # Обновляем зависимости
            # pip install -r requirements.txt

            # Если у вас Poetry (Можно определить путь до poetry which poetry)
            /home/v/.local/bin/poetry install --no-root 

            # Применяем миграции к той же БД, которую использует production
            /home/v/.local/bin/poetry run python manage.py migrate --noinput

            # Собираем статику 
            /home/v/.local/bin/poetry run python manage.py collectstatic --noinput

            # Перезапускаем сервисы только после успешной поставки кода и БД
            echo "${{ secrets.PASSWORD }}" | sudo -S systemctl restart celery_activity
            echo "${{ secrets.PASSWORD }}" | sudo -S systemctl restart celerybeat_activity
            echo "${{ secrets.PASSWORD }}" | sudo -S systemctl restart gunicorn_activity
